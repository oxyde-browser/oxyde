[package]
name = "oxyde_net"
description = "Pile réseau d'Oxyde : HTTP/1.1 et HTTP/2 sur TLS (pendant de //net)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
# Décompression des réponses ; moteur en Rust (miniz_oxide), sans zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false }
url = "2"
webpki-roots = "1"

[lints]
workspace = true
