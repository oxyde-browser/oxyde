[package]
name = "oxyde_content"
description = "Page web d'Oxyde : du HTML à la liste d'affichage (pendant de //content/renderer)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Primitives de `crypto.subtle` (RustCrypto, tout en Rust).
aes-gcm = "0.11"
getrandom = "0.3"
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
oxyde_bindings.workspace = true
oxyde_css.workspace = true
oxyde_dom.workspace = true
oxyde_html.workspace = true
oxyde_ipc.workspace = true
oxyde_js.workspace = true
oxyde_layout.workspace = true
oxyde_compositor.workspace = true
oxyde_paint.workspace = true
oxyde_text.workspace = true
sha2 = "0.11"
# Contours des glyphes, pour le texte du canevas.
skrifa = "0.44"
# Dessin du canevas 2D sur le processeur (tout en Rust).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
url = "2"

[lints]
workspace = true
